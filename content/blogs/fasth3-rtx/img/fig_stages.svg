<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Where the end-to-end time goes</title><desc id="d">Share of end-to-end time. RTX 4090 5 s 480p, 41.8 s: denoise 78%, decode 16%, rest 6%. RTX 4090 10 s 480p, 79.7 s: denoise 80%, decode 17%, rest 4%. 4x GB200 V1 768p 10 s, 15.5 s: denoise 37%, decode 25%, rest 38%.</desc>
<style>
