    .s1{fill:#7393bb} .s2{fill:#c27448} .s3{fill:#69655e} .drop{fill:#c9605a} .ref{stroke:#c3c2b7}
    .gap{stroke:#1a1a19} .on{fill:#0b0b0b} .on3{fill:#ffffff}
    .ring{fill:none;stroke:#ffffff}
  }
</style>
