<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">End-to-end generation time per clip on one GPU</title><desc id="d">Seconds from prompt to finished MP4. 480p 5 s: PRO 6000 V1 10.1, 5090 V1 12.9, PRO 6000 pruned 15.1, 5090 pruned 17.4, 4090 pruned FP8 41.8. 768p 10 s: 5090 V1 48.0, PRO 6000 V1 49.4, 5090 pruned 80.5, PRO 6000 pruned 83.9, 5090 V2 90.1.</desc>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e4e3de} .axis{stroke:#9b9a95}
  .s1{fill:#33557d} .s2{fill:#b86a3c} .s3{fill:#b5afa5} .drop{fill:#b0463c} .ref{stroke:#52514e}
  .gap{stroke:#fcfcfb} .on{fill:#ffffff} .on3{fill:#0b0b0b}
  .ring{fill:none;stroke:#0b0b0b}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
